# Build: docker compose build   -> local/pantry:latest (Portainer Git stack builds from its clone)
# Deploy: Portainer Git stack with auto-update; set APP_DIR to the host folder holding .env and storage/
services:
  pantry:
    build: .
    image: local/pantry:latest
    container_name: pantry
    restart: unless-stopped
    user: "1002:1002"   # royceu, so storage/ keeps its ownership
    ports: ["127.0.0.1:3001:3001"]
    volumes:
      - ${APP_DIR:-.}/.env:/app/.env:ro
      - ${APP_DIR:-.}/storage:/app/storage
